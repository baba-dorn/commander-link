name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      # The real discord guilds.json is deploy-time config that is gitignored. A
      # fresh checkout needs one to typecheck/test/build the Discord worker, so
      # restore it from the committed example (the canonical CI config), mirroring
      # local setup.
      - name: Restore Discord guild configuration
        shell: bash
        run: cp apps/discord/config/guilds.example.json apps/discord/config/guilds.json
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
