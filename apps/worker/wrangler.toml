name = "commander-link-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Pin a fixed dev port. 8787 is often taken by other local tooling, which would
# otherwise silently answer 404 while `wrangler dev` moves to another port.
[dev]
port = 8788

[vars]
APP_ORIGIN = "http://localhost:5173"
ROOM_TTL_SECONDS = "21600"
TOKEN_TTL_SECONDS = "3600"
MAX_ROOM_PEERS = "4"

# Metered Realtime Messaging key pair. Both are SECRETS and MUST NOT be placed
# here. Set them with:
#   wrangler secret put METERED_REALTIME_KEY_ID     # sk_id_...
#   wrangler secret put METERED_REALTIME_SECRET     # sk_secret_...
# For `wrangler dev`, put both in apps/worker/.dev.vars instead.

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomGate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomGate"]
